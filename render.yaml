services:
  - type: web
    name: bellamy-admin
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bellamy-db
          property: connectionString
      - key: RENDER_EXTERNAL_URL
        sync: false

databases:
  - name: bellamy-db
    databaseName: bellamy
    user: bellamy
